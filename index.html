<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OakLab</title><link rel="stylesheet" href="styles.css"></head><body><header><div><strong>OakLab</strong><small>Open oak experiment database</small></div><div class="head-actions"><label class="language"><span class="sr-only">Language</span><select id="language" aria-label="Language"><option value="ru">🇷🇺 Русский</option><option value="en">🇬🇧 English</option><option value="de">🇩🇪 Deutsch</option><option value="fr">🇫🇷 Français</option><option value="es">🇪🇸 Español</option><option value="pt">🇵🇹 Português</option><option value="it">🇮🇹 Italiano</option></select></label><button id="compare">Compare</button><button id="new" class="dark">+ New experiment</button></div></header><main><section class="hero"><h1>Share. Reproduce. Compare.</h1><p>A structured open database for oak infusion and aging experiments.</p></section><section id="stats" class="stats"></section><section class="tools"><input id="q" placeholder="Search experiments…"><select id="toast"><option value="">All toast levels</option><option>Light</option><option>Medium</option><option>Medium+</option><option>Heavy</option><option>Char</option></select><button id="export">Export JSON</button></section><section class="results-section"><div class="sectionhead"><h2>Experiments</h2><span id="count"></span></div><div id="list" class="results-scroll grid"></div></section></main><dialog id="compareDlg"><form method="dialog"><div class="dialoghead"><h2>Compare tastings</h2><button id="compareClose" type="submit">×</button></div><div id="compareBody"></div></form></dialog><dialog id="detail"><form method="dialog"><div class="dialoghead"><h2>Experiment</h2><button id="detailClose" type="submit">×</button></div><div id="detailBody"></div></form></dialog><dialog id="dlg"><form id="form"><div class="dialoghead"><h2>New experiment</h2><button type="button" id="close">×</button></div><div class="fields"><label>Title<input name="title" required></label><label>Author<input name="author" required></label><label>Oak type<input name="oakType" required></label><label>Toast<select name="toast"><option>Light</option><option>Medium</option><option>Medium+</option><option>Heavy</option><option>Char</option></select></label><label>Oak form<select name="form"><option value="chips">Chips</option><option value="cubes">Cubes</option><option value="stave">Stave</option><option value="other">Other</option></select></label><label>ABV %<input name="abv" type="number" step=".1"></label><label>Volume ml<input name="volumeMl" type="number" step=".1"></label><label>Oak dose g/L<input name="doseGPerL" type="number" step=".1"></label><label>Duration days<input name="durationDays" type="number" step=".1"></label><label>Temperature °C<input name="temperatureC" type="number" step=".1"></label><label>Soaking<input name="soaking" placeholder="e.g. 48 h"></label><label>Boiling<input name="boiling" placeholder="e.g. 30 min"></label><label>Source experiment ID<input name="sourceId" placeholder="For a replication"></label><label class="wide">Notes<textarea name="notes"></textarea></label></div><div class="actions"><button type="button" id="cancel">Cancel</button><button class="dark">Create local draft</button></div></form></dialog><script src="app.js"></script></body></html>
