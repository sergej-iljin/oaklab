<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OakLab</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header>
  <div><strong>OakLab</strong><small data-i18n="subtitle">Открытая база экспериментов с дубом</small></div>
  <div class="head-actions">
    <label class="language"><span class="sr-only" data-i18n="language">Язык</span><select id="language" aria-label="Язык"><option value="ru">🇷🇺 Русский</option><option value="en">🇬🇧 English</option><option value="de">🇩🇪 Deutsch</option><option value="fr">🇫🇷 Français</option><option value="es">🇪🇸 Español</option><option value="pt">🇵🇹 Português</option><option value="it">🇮🇹 Italiano</option></select></label>
    <button id="compare" data-i18n="compare">Сравнить</button><button id="new" class="dark" data-i18n="newExp">+ Новый эксперимент</button>
  </div>
</header>
<main>
<section class="hero"><h1 data-i18n="hero">Делись. Воспроизводи. Сравнивай.</h1><p data-i18n="intro">Структурированная открытая база экспериментов с дубовой выдержкой и настаиванием.</p></section>
<section id="stats" class="stats"></section>
<section class="tools"><input id="q" data-i18n-placeholder="search" placeholder="Поиск экспериментов…"><select id="toast"><option value="" data-i18n="allToast">Все степени обжарки</option><option>Light</option><option>Medium</option><option>Medium+</option><option>Heavy</option><option>Char</option></select><button id="export" data-i18n="export">Экспорт JSON</button></section>
<section class="results-section"><div class="sectionhead"><h2 data-i18n="experiments">Эксперименты</h2><span id="count"></span></div><div id="list" class="results-scroll grid"></div></section>
</main>
<dialog id="compareDlg"><form method="dialog"><div class="dialoghead"><h2 data-i18n="compareTitle">Сравнение дегустаций</h2><button type="submit">×</button></div><div id="compareBody"></div></form></dialog>
<dialog id="detail"><form method="dialog"><div class="dialoghead"><h2 data-i18n="detail">Эксперимент</h2><button type="submit">×</button></div><div id="detailBody"></div></form></dialog>
<dialog id="dlg"><form id="form"><div class="dialoghead"><h2 data-i18n="newTitle">Новый эксперимент</h2><button type="button" id="close">×</button></div>
<div class="fields">
<label><span data-i18n="title">Название</span><input name="title" required></label><label><span data-i18n="author">Автор</span><input name="author" required></label><label><span data-i18n="oakType">Тип дуба</span><input name="oakType" required></label>
<label><span data-i18n="toast">Обжарка</span><select name="toast"><option>Light</option><option>Medium</option><option>Medium+</option><option>Heavy</option><option>Char</option></select></label>
<label><span data-i18n="oakForm">Форма дуба</span><select name="form"><option value="chips" data-i18n="chips">Щепа</option><option value="cubes" data-i18n="cubes">Кубики</option><option value="stave" data-i18n="stave">Планка</option><option value="other" data-i18n="other">Другое</option></select></label>
<label><span>ABV %</span><input name="abv" type="number" step=".1"></label><label><span data-i18n="volume">Объём мл</span><input name="volumeMl" type="number" step=".1"></label><label><span data-i18n="dose">Доза дуба г/л</span><input name="doseGPerL" type="number" step=".1"></label><label><span data-i18n="duration">Длительность, дней</span><input name="durationDays" type="number" step=".1"></label><label><span data-i18n="temperature">Температура °C</span><input name="temperatureC" type="number" step=".1"></label>
<label><span data-i18n="soaking">Замачивание</span><input name="soaking" placeholder="48 h"></label><label><span data-i18n="boiling">Кипячение</span><input name="boiling" placeholder="30 min"></label><label><span data-i18n="sourceId">ID исходного эксперимента</span><input name="sourceId"></label><label class="wide"><span data-i18n="notes">Заметки</span><textarea name="notes"></textarea></label>
</div><div class="actions"><button type="button" id="cancel" data-i18n="cancel">Отмена</button><button class="dark" data-i18n="create">Создать локальный черновик</button></div></form></dialog>
<script src="app.js?v=20260925-0945"></script>
</body></html>
