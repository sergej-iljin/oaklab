<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OakLab</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div><strong>OakLab</strong><small>Open oak experiment database</small></div>
<button id="new" class="dark">+ New experiment</button></header>
<main>
<section class="hero"><h1>Share. Reproduce. Compare.</h1><p>A structured open database for oak infusion and aging experiments.</p></section>
<section id="stats" class="stats"></section>
<section class="tools"><input id="q" placeholder="Search experiments…"><select id="toast"><option value="">All toast levels</option><option>Light</option><option>Medium</option><option>Medium+</option><option>Heavy</option><option>Char</option></select><button id="export">Export JSON</button></section>
<section><div class="sectionhead"><h2>Experiments</h2><span id="count"></span></div><div id="list" class="grid"></div></section>
</main>
<dialog id="dlg"><form id="form">
<div class="dialoghead"><h2>New experiment</h2><button type="button" id="close">×</button></div>
<div class="fields">
<label>Title<input name="title" required></label><label>Author<input name="author" required></label>
<label>Oak type<input name="oakType" required></label><label>Toast<select name="toast"><option>Light</option><option>Medium</option><option>Medium+</option><option>Heavy</option><option>Char</option></select></label>
<label>Preparation<input name="preparation"></label><label>ABV %<input name="abv" type="number" step=".1"></label>
<label>Volume ml<input name="volume" type="number"></label><label>Oak dose g/L<input name="dose" type="number" step=".1"></label>
<label>Duration days<input name="duration" type="number"></label><label>Temperature °C<input name="temperature" type="number" step=".1"></label>
<label>Source experiment ID<input name="sourceId" placeholder="For a replication"></label>
<label class="wide">Notes<textarea name="notes"></textarea></label>
</div><div class="actions"><button type="button" id="cancel">Cancel</button><button class="dark">Save</button></div>
</form></dialog>
<script src="app.js"></script>
</body></html>
